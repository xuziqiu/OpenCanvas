name: 问题报告
description: 报告可复现的故障、资料异常或交互问题
title: "[问题] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要上传私人笔记正文、附件或完整知识库；优先粘贴应用“关于与诊断”中生成的脱敏摘要。
  - type: input
    id: version
    attributes:
      label: OpenCanvas 版本
      description: 可在左下角工作区菜单的“关于与诊断”中查看。
      placeholder: 例如 1.0.10
    validations:
      required: true
  - type: dropdown
    id: vault-location
    attributes:
      label: 知识库所在位置
      options:
        - 本机普通文件夹
        - OneDrive、Dropbox 等同步文件夹
        - 移动硬盘或网络位置
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏诊断信息
      description: 在“关于与诊断”中点击“复制诊断信息”后粘贴。它不包含笔记正文或附件。
      render: text
  - type: textarea
    id: media
    attributes:
      label: 截图或录屏
      description: 请先遮盖私人内容。
